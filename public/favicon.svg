<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Bold "B" lettermark in brand blue — no background -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7BB3FF"/>
      <stop offset="100%" stop-color="#4F8EF7"/>
    </linearGradient>
  </defs>
  <!-- Stem -->
  <rect x="12" y="6" width="14" height="52" rx="4" fill="url(#g)"/>
  <!-- Top bowl -->
  <rect x="22" y="6" width="18" height="22" rx="4" fill="url(#g)"/>
  <rect x="36" y="8" width="8" height="18" rx="9" fill="url(#g)"/>
  <circle cx="40" cy="17" r="11" fill="url(#g)"/>
  <!-- Top counter (cutout) -->
  <circle cx="36" cy="17" r="6" fill="#0A0A0A"/>
  <!-- Bottom bowl (bigger) -->
  <rect x="22" y="32" width="20" height="26" rx="4" fill="url(#g)"/>
  <circle cx="42" cy="45" r="13" fill="url(#g)"/>
  <!-- Bottom counter (cutout) -->
  <circle cx="38" cy="45" r="7" fill="#0A0A0A"/>
</svg>
